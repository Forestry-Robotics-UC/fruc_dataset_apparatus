networks:
  ros2-net:
    driver: bridge

services:
  # Base image - foundation for other services
  base:
    build:
      context: .
      dockerfile: Dockerfile.base
      target: base
      args:
        ROS_DISTRO: jazzy
    image: ros2-apparatus-base:jazzy
    stdin_open: true
    tty: true
    privileged: true
    container_name: ros2-apparatus-base

  # Sensor Services
  realsense:
    build:
      context: .
      dockerfile: Dockerfile.realsense
      target: realsense
    image: ros2-apparatus-realsense:jazzy
    stdin_open: true
    tty: true
    privileged: true
    container_name: ros2-apparatus-realsense
    networks:
      - ros2-net
    volumes:
      - ./shared:/shared
    command:
      - ros2
      - launch
      - rslaunch
      - rs_launch.py
      - use_sim_time:=False

  xsens:
    build:
      context: .
      dockerfile: Dockerfile.xsens
      target: xsens
    image: ros2-apparatus-xsens:jazzy
    stdin_open: true
    tty: true
    privileged: true
    container_name: ros2-apparatus-xsens
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    networks:
      - ros2-net
    volumes:
      - ./shared:/shared
    command:
      - /shared/scripts/xsens-launch.sh

  ouster:
    build:
      context: .
      dockerfile: Dockerfile.ouster
      target: ouster
    image: ros2-apparatus-ouster:jazzy
    stdin_open: true
    tty: true
    privileged: true
    container_name: ros2-apparatus-ouster
    ports:
      - 7502:7502/udp
      - 7503:7503/udp
    networks:
      - ros2-net
    volumes:
      - ./shared:/shared
    command:
      - ros2
      - launch
      - ouster_ros
      - driver.launch.py
      - viz:=false
      - params_file:=/shared/ouster_config.yaml

  emlid:
    build:
      context: .
      dockerfile: Dockerfile.emlid
      target: emlid
      args:
        BASE_IMAGE: ros2-apparatus-base:jazzy
        ROS_DISTRO: jazzy
    image: ros2-apparatus-emlid:jazzy
    depends_on:
      - base
    stdin_open: true
    tty: true
    privileged: true
    container_name: ros2-apparatus-emlid
    devices:
      - /dev/ttyACM1:/dev/ttyACM1
    networks:
      - ros2-net
    volumes:
      - ./shared:/shared
    command:
      - ros2
      - run
      - nmea_navsat_driver
      - nmea_serial_driver
      - --ros-args
      - -p
      - port:=/dev/ttyACM1
      - -p
      - baud:=9600

  # Visualization Services
  foxglove-bridge:
    image: mjpc13/foxglove-bridge:latest
    stdin_open: true
    tty: true
    container_name: ros2-apparatus-foxglove-bridge
    networks:
      - ros2-net
    ports:
      - 9092:8765

  # Utility Services
  recording:
    build:
      context: .
      dockerfile: Dockerfile.recording
      target: recording
    image: ros2-apparatus-recording:jazzy
    stdin_open: true
    tty: true
    privileged: true
    container_name: ros2-apparatus-recording
    networks:
      - ros2-net
    volumes:
      - ./shared:/shared
      - ../rosbags:/rosbags
    command:
      - /bin/bash

  publisher:
    build:
      context: .
      dockerfile: Dockerfile.publisher
      target: publisher
    image: ros2-apparatus-publisher:jazzy
    stdin_open: true
    tty: true
    privileged: true
    container_name: ros2-apparatus-publisher
    networks:
      - ros2-net
    volumes:
      - ./shared:/shared
    command: >
      /bin/bash -c "
      xacro /shared/apparatus.urdf.xacro > /tmp/robot_description.urdf &&
      ros2 run robot_state_publisher robot_state_publisher /tmp/robot_description.urdf
      "