version: '3.9'

networks:
  link-local-net:
    external: true
  ros2-net:
    driver: bridge

services:
  # Sensor Services
  realsense:
    build:
      context: .
      dockerfile: Dockerfile.realsense
    image: ros2-apparatus-realsense:jazzy
    stdin_open: true
    tty: true
    privileged: true
    container_name: ros2-apparatus-realsense
    networks:
      - ros2-net
    volumes:
      - ./docker_shared:/shared
      - /dev:/dev
    command:
      - ros2
      - launch
      - rslaunch
      - rs_launch.py
      - use_sim_time:=False

  xsens:
    build:
      context: .
      dockerfile: Dockerfile.xsens
    image: ros2-apparatus-xsens:jazzy
    stdin_open: true
    tty: true
    privileged: true
    container_name: ros2-apparatus-xsens
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    networks:
      - ros2-net
    volumes:
      - ./docker_shared:/shared
    command:
      - /shared/scripts/xsens-launch.sh

  ouster:
    build:
      context: .
      dockerfile: Dockerfile.ouster
    image: ros2-apparatus-ouster:jazzy
    stdin_open: true
    tty: true
    privileged: true
    container_name: ros2-apparatus-ouster
    ports:
      - 7502:7502/udp
      - 7503:7503/udp
    networks:
      - ros2-net
    volumes:
      - ./docker_shared:/shared
    command:
      - ros2
      - launch
      - ouster_ros
      - driver.launch.py
      - viz:=false
      - params_file:=/shared/ouster_config.yaml

  emlid:
    build:
      context: .
      dockerfile: Dockerfile.emlid
    image: ros2-apparatus-emlid:jazzy
    stdin_open: true
    tty: true
    privileged: true
    container_name: ros2-apparatus-emlid
    devices:
      - /dev/ttyACM1:/dev/ttyACM1
    networks:
      - ros2-net
    volumes:
      - ./docker_shared:/shared
    command:
      - ros2
      - run
      - nmea_navsat_driver
      - nmea_serial_driver
      - --ros-args
      - -p
      - port:=/dev/ttyACM1
      - -p
      - baud:=9600

  # Visualization Services
  foxglove-bridge:
    image: mjpc13/foxglove-bridge:latest
    stdin_open: true
    tty: true
    container_name: ros2-apparatus-foxglove-bridge
    networks:
      - ros2-net
    ports:
      - 9092:8765

  # Utility Services
  recording:
    build:
      context: .
      dockerfile: Dockerfile.recording
    image: ros2-apparatus-recording:jazzy
    stdin_open: true
    tty: true
    privileged: true
    container_name: ros2-apparatus-recording
    networks:
      - ros2-net
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Mount home directory for X11 authentication
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
      - ./docker_shared:/shared
      - ../rosbags:/rosbags
    command: ${SCRIPT_ARGS:-}
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1

  publisher:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    image: ros2-apparatus-publisher:jazzy
    stdin_open: true
    tty: true
    privileged: true
    container_name: ros2-apparatus-publisher
    networks:
      - ros2-net
    volumes:
      - ./docker_shared:/shared
      - /tmp/.X11-unix:/tmp/.X11-unix  # X11 socket for GUI
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=${DISPLAY}  # Forward the display for GUI
      - QT_X11_NO_MITSHM=1  # Disable MIT-SHM for X11 forwarding
    command:
      - ros2
      - launch
      - apparatus_description
      - robot_state_publisher.launch.py