services:
  debug-bridge:
    build:
      context: .
      dockerfile: Dockerfile.debug
    image: ros2-apparatus-debug:jazzy
    container_name: ros2-apparatus-debug-bridge
    stdin_open: true
    tty: true
    privileged: true
    networks:
      - ros2-net
    volumes:
      - ./docker_shared:/shared
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
      - /proc:/proc:ro
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}

  debug-host:
    build:
      context: .
      dockerfile: Dockerfile.debug
    image: ros2-apparatus-debug:jazzy
    container_name: ros2-apparatus-debug-host
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    volumes:
      - ./docker_shared:/shared
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
      - /proc:/proc:ro
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}

  diagnostic-common:
    build:
      context: .
      dockerfile: Dockerfile.debug
    image: ros2-apparatus-debug:jazzy
    container_name: ros2-apparatus-diagnostic-common
    stdin_open: true
    tty: true
    privileged: true
    networks:
      - ros2-net
    profiles:
      - observability
    volumes:
      - ./docker_shared:/shared
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    command:
      - /shared/scripts/diagnostics/diagnostic_common_runner.sh

  topic-monitor:
    build:
      context: .
      dockerfile: Dockerfile.debug
    image: ros2-apparatus-debug:jazzy
    container_name: ros2-apparatus-topic-monitor
    stdin_open: true
    tty: true
    privileged: true
    networks:
      - ros2-net
    profiles:
      - observability
    volumes:
      - ./docker_shared:/shared
    environment:
      - TOPIC_MONITOR_AUTOSTART=${TOPIC_MONITOR_AUTOSTART:-0}
      - TOPIC_MONITOR_TOPIC=${TOPIC_MONITOR_TOPIC:-/diagnostics_agg}
      - TOPIC_MONITOR_TOPICS=${TOPIC_MONITOR_TOPICS:-/diagnostics_agg,/diagnostics}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    command:
      - /shared/scripts/diagnostics/topic_monitor_runner.sh

  diagnostic-aggregator:
    build:
      context: .
      dockerfile: Dockerfile.debug
    image: ros2-apparatus-debug:jazzy
    container_name: ros2-apparatus-diagnostic-aggregator
    stdin_open: true
    tty: true
    privileged: true
    networks:
      - ros2-net
    profiles:
      - observability
    volumes:
      - ./docker_shared:/shared
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    command:
      - ros2
      - run
      - diagnostic_aggregator
      - aggregator_node
      - --ros-args
      - --params-file
      - /shared/scripts/diagnostics/diagnostic_aggregator.yaml

  ros2-tracing:
    build:
      context: .
      dockerfile: Dockerfile.debug
    image: ros2-apparatus-debug:jazzy
    container_name: ros2-apparatus-ros2-tracing
    stdin_open: true
    tty: true
    privileged: true
    networks:
      - ros2-net
    profiles:
      - profiling
    volumes:
      - ./docker_shared:/shared
    environment:
      - TRACE_AUTOSTART=${TRACE_AUTOSTART:-0}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    command:
      - /shared/scripts/diagnostics/ros2_tracing_runner.sh

networks:
  ros2-net:
    driver: bridge
    name: ${ROS2_NETWORK_NAME:-ros2_net}
